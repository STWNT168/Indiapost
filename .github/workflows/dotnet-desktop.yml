name: Build India Post Administrative Suite

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: windows-latest

    steps:

      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore IndiaPostAdminSuite/IndiaPostAdminSuite.csproj

      - name: Build Release
        run: dotnet build IndiaPostAdminSuite/IndiaPostAdminSuite.csproj --configuration Release --no-restore

      - name: Publish Windows x64 EXE
        run: >
          dotnet publish
          IndiaPostAdminSuite/IndiaPostAdminSuite.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish

      - name: Create ZIP package
        shell: pwsh
        run: |
          Compress-Archive `
            -Path publish\* `
            -DestinationPath IndiaPostAdminSuite-Windows-x64.zip `
            -Force

      - name: Upload Windows EXE package
        uses: actions/upload-artifact@v4
        with:
          name: IndiaPostAdminSuite-Windows-x64
          path: IndiaPostAdminSuite-Windows-x64.zip
